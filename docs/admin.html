<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Результаты аудита клуба</title>
  <link rel="stylesheet" href="admin.css?v=2">
</head>
<body>
  <header class="admin-header">
    <a href="./" class="admin-brand">АУДИТ КЛУБА</a>
    <span>Закрытый раздел</span>
  </header>

  <main class="admin-shell">
    <section id="login-view" class="login-card">
      <span class="eyebrow">РЕЗУЛЬТАТЫ АУДИТА</span>
      <h1>Вход для администратора</h1>
      <p>Ответы доступны только авторизованным пользователям проекта.</p>
      <form id="login-form">
        <label>Email<input type="email" name="email" autocomplete="username" required></label>
        <label>Пароль<input type="password" name="password" autocomplete="current-password" required></label>
        <button type="submit">Войти</button>
        <p id="login-error" class="error" role="alert"></p>
      </form>
    </section>

    <section id="dashboard-view" class="dashboard" hidden>
      <div class="dashboard-title">
        <div><span class="eyebrow">РЕЗУЛЬТАТЫ АУДИТА</span><h1>Ответы сотрудников</h1></div>
        <div class="header-actions"><span id="session-email"></span><button id="logout" class="button-secondary">Выйти</button></div>
      </div>

      <div class="metrics">
        <article><span>Ответов</span><strong id="metric-total">0</strong></article>
        <article><span>Респондентов</span><strong id="metric-people">0</strong></article>
        <article><span>Последний ответ</span><strong id="metric-latest">—</strong></article>
      </div>

      <div class="toolbar">
        <label>Анкета<select id="filter-form"><option value="">Все анкеты</option></select></label>
        <label>Поиск<input id="filter-search" type="search" placeholder="Имя, должность или ответ"></label>
        <div class="toolbar-actions"><button id="refresh" class="button-secondary">Обновить</button><button id="export">Экспорт CSV</button></div>
      </div>

      <div id="status" class="status" aria-live="polite"></div>
      <div id="results" class="results"></div>
    </section>
  </main>

  <script src="admin.js?v=2" defer></script>
</body>
</html>
